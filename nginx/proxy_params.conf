# Shared upstream proxy settings, included by every location so they cannot drift between vhosts.
# Mounted at /etc/nginx/proxy_params.conf (deliberately outside conf.d, which nginx auto-includes as
# server config, and outside templates/, so its $nginx_variables are never touched by envsubst).

proxy_http_version 1.1;

# WebSockets: Blazor Server (storefront + admin) and the API's SignalR hubs all need the upgrade to
# pass through. $connection_upgrade is mapped in nginx.conf.
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# A Blazor circuit is a long-lived connection; the 60s default would drop idle tabs.
proxy_connect_timeout 10s;
proxy_send_timeout    300s;
proxy_read_timeout    300s;

proxy_buffering off;
