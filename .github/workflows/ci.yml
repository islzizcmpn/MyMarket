name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The solution includes the MAUI head, which needs mobile workloads this job does not install
      # (it is built in the `mobile` job instead). Restore the server projects explicitly.
      - name: Restore
        run: |
          dotnet restore src/PcMarket.Api/PcMarket.Api.csproj
          dotnet restore src/PcMarket.Web/PcMarket.Web.csproj
          dotnet restore src/PcMarket.Admin/PcMarket.Admin.csproj
          dotnet restore tests/PcMarket.UnitTests/PcMarket.UnitTests.csproj
          dotnet restore tests/PcMarket.IntegrationTests/PcMarket.IntegrationTests.csproj

      - name: Build
        run: |
          dotnet build src/PcMarket.Api/PcMarket.Api.csproj     -c Release --no-restore
          dotnet build src/PcMarket.Web/PcMarket.Web.csproj     -c Release --no-restore
          dotnet build src/PcMarket.Admin/PcMarket.Admin.csproj -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/PcMarket.UnitTests/PcMarket.UnitTests.csproj -c Release --no-restore --logger "trx;LogFileName=unit.trx"

      # Testcontainers starts throwaway PostgreSQL + Redis containers; the hosted runner's Docker
      # daemon serves them, so no service containers are declared here.
      - name: Integration tests
        run: dotnet test tests/PcMarket.IntegrationTests/PcMarket.IntegrationTests.csproj -c Release --no-restore --logger "trx;LogFileName=integration.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  mobile:
    name: Build MAUI (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Only the Android head is built here: iOS/MacCatalyst need macOS, and the project already
      # excludes them on Linux. Signing is out of scope (see mobile_app/ios-build.md).
      - name: Install Android workload
        run: dotnet workload install android

      - name: Build Android head
        run: dotnet build src/PcMarket.Mobile/PcMarket.Mobile.csproj -f net10.0-android -c Release

  images:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: [build-test]
    # Images are only published for the default branch and release tags — a PR gets the build-test
    # gate but must not push anything.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: src/PcMarket.Api/Dockerfile
          - name: web
            dockerfile: src/PcMarket.Web/Dockerfile
          - name: admin
            dockerfile: src/PcMarket.Admin/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
